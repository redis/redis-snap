# This wokrflow is for building and publishing nightly unstable builds of Redis with edge risk level.
name: Unstable

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SECURITY_API_TOKEN:
        description: Tracebit API token for CI canary credentials
        required: false

env:
  # Fork pull requests and Dependabot runs do not receive the Tracebit secret.
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  build:
    uses: ./.github/workflows/build-n-test.yml
    secrets:
      SECURITY_API_TOKEN: ${{ secrets.SECURITY_API_TOKEN }}
    with:
      release_tag: unstable

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: >-
            ${{ (github.ref_name == 'unstable'
            || github.event_name == 'workflow_call'
            || github.event_name == 'schedule')
            && 'unstable'
            || ''
            }}

      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@904ee3a84578e3b19bcd0e8c9354051fe148d51e # v1.3.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true

      - name: Upload all architectures to Snap Store
        uses: ./.github/actions/upload
        with:
          risk_level: 'edge'
          snapcraft_store_credentials: ${{ secrets.SNAP_TOKEN }}
